[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zensical-dirtree"
dynamic = ["version"]
description = "Interactive directory-tree explorer for Zensical documentation sites"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Markus Ritschel", email = "git@markusritschel.de" }]
keywords = ["zensical", "markdown", "markdown-extension", "documentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "markdown>=3.4",
    "pymdown-extensions>=10.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/markusritschel/zensical-dirtree"
Repository = "https://github.com/markusritschel/zensical-dirtree"
Issues = "https://github.com/markusritschel/zensical-dirtree/issues"
Changelog = "https://github.com/markusritschel/zensical-dirtree/blob/main/CHANGELOG.md"

[project.scripts]
zensical-dirtree = "zensical_dirtree.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8",
    "ruff>=0.6",
    "zensical>=0.0.60",
]

[tool.hatch.version]
path = "src/zensical_dirtree/__init__.py"

[tool.hatch.build.targets.sdist]
# Code, tests and the example they build; README, LICENSE and pyproject.toml
# are always included. Maintainer files (AGENTS.md, DESIGN.md, ...) stay in
# the repository.
only-include = ["src", "tests", "example", "CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/zensical_dirtree"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
